name: Build & Publish Docker Image

on:
  push:
    # 仅在推送/创建 Git Tag 时触发构建，普通分支推送 (如 master/main) 均不触发
    tags:
      - 'v*.*.*'
      - 'v*'
      - '[0-9]+.*'
      - '*'
  workflow_dispatch: # 支持在 GitHub 网页手动触发

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 严格守卫：双重确保只有 Tag 推送或手动触发才会执行构建
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Configure Image Names
        id: img-names
        run: |
          IMAGES="ghcr.io/${{ github.repository }}"
          DH_REPO=""
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            DH_REPO="${DOCKERHUB_REPO:-$DOCKERHUB_USERNAME/core-keeper-dedicated-server}"
            IMAGES="${IMAGES}"$'\n'"${DH_REPO}"
          fi
          echo "dh_repo=${DH_REPO}" >> $GITHUB_OUTPUT
          echo "images<<EOF" >> $GITHUB_OUTPUT
          echo "$IMAGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img-names.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Description
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
          repository: ${{ steps.img-names.outputs.dh_repo }}
          readme-filepath: ./README_dockerhub.md
          short-description: "Core Keeper Dedicated Server with Web GUI, Multi-instance, Steam SDR & Direct Connect, Mod.io & Workshop."
